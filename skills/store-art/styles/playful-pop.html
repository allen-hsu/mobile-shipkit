<!doctype html><!-- default-layout: two-up --><html lang="{{locale}}"><head><meta charset="utf-8">{{{fontsHead}}}<style>
{{{baseCss}}}
:root{{{{brandCss}}};--pad:110px;--copy-top:190px;--copy-bottom:200px}
body{background:var(--bg,#58CC02);color:var(--ink,#fff);font-family:'Nunito','Noto Sans TC','Noto Sans JP',sans-serif}
.blob{position:absolute;border-radius:50%;z-index:0;opacity:.35;background:#fff}
.o1{width:900px;height:900px;right:-350px;top:-300px}
.o2{width:520px;height:520px;left:-200px;top:1500px;opacity:.2}
.copy{text-align:center}
.badge{display:inline-block;background:#fff;color:var(--bg,#58CC02);border-radius:999px;padding:16px 40px;font-weight:900;font-size:40px;box-shadow:0 10px 0 #00000022}
h1{font-weight:900;font-size:{{{titleSize}}}px;line-height:1.04;margin-top:40px;letter-spacing:-.02em;text-shadow:0 8px 0 #00000022}
h1 em{font-style:normal;color:var(--accent,#FFC800)}
p{font-size:52px;line-height:1.4;margin:34px auto 0;max-width:960px;font-weight:800;opacity:.92}
.device{filter:drop-shadow(0 40px 0 #00000026)!important}
</style></head><body>
<div class="blob o1"></div><div class="blob o2"></div>
<div class="copy {{{copyPos}}}">{{#badge}}<span class="badge">{{badge}}</span>{{/badge}}<h1>{{title}}</h1>{{#subtitle}}<p>{{subtitle}}</p>{{/subtitle}}</div>
{{{device}}}
</body></html>
