<!doctype html><!-- default-layout: bleed-bottom --><html lang="{{locale}}"><head><meta charset="utf-8">{{{fontsHead}}}<style>
{{{baseCss}}}
:root{{{{brandCss}}};--pad:110px;--copy-top:180px;--copy-bottom:190px}
body{background:var(--bg,#0A0A0B);color:var(--ink,#F5F5F7);font-family:'Inter','Noto Sans TC','Noto Sans JP',sans-serif;
  background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:120px 120px}
.beam{position:absolute;left:50%;top:-600px;width:1600px;height:1600px;transform:translateX(-50%);border-radius:50%;z-index:0;background:radial-gradient(circle,color-mix(in srgb,var(--accent,#7C8CF8) 30%,transparent),transparent 60%)}
.badge{display:inline-flex;align-items:center;gap:14px;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:32px;letter-spacing:.08em;color:#A1A1AA;border:1px solid #ffffff2e;border-radius:10px;padding:12px 24px}
.badge::before{content:'';width:14px;height:14px;border-radius:50%;background:var(--accent2,#34D399);box-shadow:0 0 18px var(--accent2,#34D399)}
h1{font-weight:700;font-size:{{{titleSize}}}px;line-height:1.04;margin-top:40px;letter-spacing:-.035em}
h1 em{font-style:normal;background:linear-gradient(90deg,#fff,var(--accent,#7C8CF8));-webkit-background-clip:text;color:transparent}
p{font-size:48px;line-height:1.45;margin-top:32px;max-width:980px;color:#A1A1AA;font-weight:400}
.device{filter:drop-shadow(0 0 0 1px #ffffff22) drop-shadow(0 60px 100px rgba(0,0,0,.8))!important}
.rim{position:absolute;inset:0;z-index:5;pointer-events:none;box-shadow:inset 0 0 0 2px #ffffff10}
</style></head><body>
<div class="beam"></div><div class="rim"></div>
<div class="copy {{{copyPos}}}">{{#badge}}<span class="badge">{{badge}}</span>{{/badge}}<h1>{{title}}</h1>{{#subtitle}}<p>{{subtitle}}</p>{{/subtitle}}</div>
{{{device}}}
</body></html>
