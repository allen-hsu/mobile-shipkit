<!doctype html><!-- default-layout: card-stack --><html lang="{{locale}}"><head><meta charset="utf-8">{{{fontsHead}}}<style>
{{{baseCss}}}
:root{{{{brandCss}}};--pad:120px;--copy-top:200px;--copy-bottom:200px}
body{background:linear-gradient(170deg,var(--bg,#FFF1F5) 0%,var(--accent2,#E9F3FF) 100%);color:var(--ink,#3B2F4A);font-family:'DM Sans','Inter','Noto Sans TC','Noto Sans JP',sans-serif}
.c{position:absolute;border-radius:50%;z-index:0;opacity:.9}
.c1{width:640px;height:640px;background:var(--accent,#FFD6E0);left:-200px;bottom:300px}
.c2{width:420px;height:420px;background:#FFF5B8;right:-120px;top:520px}
.c3{width:260px;height:260px;background:#CDE8FF;left:260px;top:1100px}
.copy{text-align:center}
.badge{display:inline-block;background:#fff;color:var(--ink,#3B2F4A);border-radius:999px;padding:16px 38px;font-weight:700;font-size:38px;box-shadow:0 12px 30px #0000000f}
h1{font-weight:800;font-size:{{{titleSize}}}px;line-height:1.12;margin-top:40px;letter-spacing:-.02em}
h1 em{font-style:normal;color:#E0568B}
p{font-size:50px;line-height:1.5;margin:36px auto 0;max-width:960px;color:#6F6380;font-weight:500}
.device{filter:drop-shadow(0 50px 70px rgba(120,80,140,.25))!important}
</style></head><body>
<div class="c c1"></div><div class="c c2"></div><div class="c c3"></div>
<div class="copy {{{copyPos}}}">{{#badge}}<span class="badge">{{badge}}</span>{{/badge}}<h1>{{title}}</h1>{{#subtitle}}<p>{{subtitle}}</p>{{/subtitle}}</div>
{{{device}}}
</body></html>
