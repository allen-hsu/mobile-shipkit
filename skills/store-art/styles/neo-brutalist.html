<!doctype html><!-- default-layout: tilt-right --><!-- device-offset: 90 --><html lang="{{locale}}"><head><meta charset="utf-8">{{{fontsHead}}}<style>
{{{baseCss}}}
:root{{{{brandCss}}};--pad:100px;--copy-top:170px;--copy-bottom:190px}
body{background:var(--bg,#FFE14D);color:var(--ink,#111);font-family:'Archivo Black','Space Grotesk','Noto Sans TC','Noto Sans JP',sans-serif}
.box{position:absolute;border:8px solid #111;background:#fff;box-shadow:22px 22px 0 #111;z-index:0}
.bx1{width:520px;height:520px;right:-140px;top:1180px;background:var(--accent,#FF6B6B);transform:rotate(8deg)}
.bx2{width:300px;height:300px;left:-80px;top:1700px;background:var(--accent2,#4D96FF);border-radius:50%;box-shadow:16px 16px 0 #111}
.badge{display:inline-block;border:6px solid #111;background:#fff;box-shadow:10px 10px 0 #111;padding:14px 30px;font-size:38px;letter-spacing:.04em;text-transform:uppercase}
h1{font-size:{{{titleSize}}}px;line-height:.98;margin-top:48px;letter-spacing:-.02em;text-transform:uppercase}
h1 em{font-style:normal;background:#fff;border:6px solid #111;box-shadow:12px 12px 0 #111;padding:0 18px;display:inline-block;line-height:1.1}
p{font-family:'Space Grotesk',sans-serif;font-size:50px;line-height:1.4;margin-top:44px;max-width:980px;font-weight:700}
.device{filter:drop-shadow(26px 26px 0 #111)!important}
</style></head><body>
<div class="box bx1"></div><div class="box bx2"></div>
<div class="copy {{{copyPos}}}">{{#badge}}<span class="badge">{{badge}}</span>{{/badge}}<h1>{{title}}</h1>{{#subtitle}}<p>{{subtitle}}</p>{{/subtitle}}</div>
{{{device}}}
</body></html>
