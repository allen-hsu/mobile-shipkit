<!doctype html><!-- default-layout: peek-sides --><html lang="{{locale}}"><head><meta charset="utf-8">{{{fontsHead}}}<style>
{{{baseCss}}}
:root{{{{brandCss}}};--pad:100px;--copy-top:170px;--copy-bottom:190px}
body{background:var(--bg,#0A0A0A);color:var(--ink,#fff);font-family:'Space Grotesk','Inter','Noto Sans TC','Noto Sans JP',sans-serif}
.stripe{position:absolute;left:-20%;right:-20%;height:520px;top:1500px;background:var(--accent,#C8FF00);transform:rotate(-10deg);z-index:0}
.stripe2{position:absolute;left:-20%;right:-20%;height:120px;top:2150px;background:var(--accent2,#FF3D81);transform:rotate(-10deg);z-index:0}
.badge{display:inline-block;border:4px solid var(--accent,#C8FF00);color:var(--accent,#C8FF00);border-radius:16px;padding:14px 30px;font-weight:700;font-size:38px;letter-spacing:.1em;text-transform:uppercase}
h1{font-weight:700;font-size:{{{titleSize}}}px;line-height:.98;margin-top:44px;letter-spacing:-.04em;text-transform:uppercase}
h1 em{font-style:normal;color:var(--accent,#C8FF00)}
p{font-size:52px;line-height:1.4;margin-top:40px;max-width:980px;color:#C9C9C9;font-weight:500}
.device{filter:drop-shadow(0 50px 80px rgba(0,0,0,.7))!important}
</style></head><body>
<div class="stripe"></div><div class="stripe2"></div>
<div class="copy {{{copyPos}}}">{{#badge}}<span class="badge">{{badge}}</span>{{/badge}}<h1>{{title}}</h1>{{#subtitle}}<p>{{subtitle}}</p>{{/subtitle}}</div>
{{{device}}}
</body></html>
