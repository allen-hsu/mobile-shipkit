<!doctype html><!-- device-offset: 110 --><html lang="{{locale}}"><head><meta charset="utf-8">{{{fontsHead}}}<style>
{{{baseCss}}}
:root{{{{brandCss}}};--pad:110px;--copy-top:180px;--copy-bottom:190px}
body{background:var(--bg,#12081F);color:var(--ink,#fff);font-family:'Inter','Noto Sans TC','Noto Sans JP',sans-serif}
.m{position:absolute;border-radius:50%;filter:blur(120px);z-index:0;opacity:.8}
.m1{width:1100px;height:1100px;background:var(--accent,#7C3AED);left:-300px;top:-200px}
.m2{width:1000px;height:1000px;background:var(--accent2,#06B6D4);right:-300px;top:700px}
.m3{width:900px;height:900px;background:#F472B6;left:200px;bottom:-300px;opacity:.6}
.panel{position:absolute;left:70px;right:70px;padding:70px 70px 80px;border-radius:64px;background:#ffffff12;border:2px solid #ffffff26;backdrop-filter:blur(40px);z-index:3}
.panel.top{top:130px}.panel.bottom{bottom:150px}.panel.none{display:none}
.copy{position:static}
.badge{display:inline-block;background:#ffffff22;border:2px solid #ffffff40;border-radius:999px;padding:14px 34px;font-weight:700;font-size:36px;letter-spacing:.08em}
h1{font-weight:900;font-size:{{{titleSize}}}px;line-height:1.08;margin-top:40px;letter-spacing:-.02em}
h1 em{font-style:normal;background:linear-gradient(90deg,#fff,var(--accent2,#67E8F9));-webkit-background-clip:text;color:transparent}
p{font-size:50px;line-height:1.45;margin-top:36px;max-width:1000px;color:#E9D5FF;font-weight:500}
.device{filter:drop-shadow(0 60px 90px rgba(0,0,0,.6))!important}
</style></head><body>
<div class="m m1"></div><div class="m m2"></div><div class="m m3"></div>
<div class="panel {{{copyPos}}}"><div class="copy">{{#badge}}<span class="badge">{{badge}}</span>{{/badge}}<h1>{{title}}</h1>{{#subtitle}}<p>{{subtitle}}</p>{{/subtitle}}</div></div>
{{{device}}}
</body></html>
